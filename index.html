<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMATRÍA 32 | Análisis Numérico (v5)</title>

    <link rel="manifest" href="manifest.json?v=5">
    <meta name="theme-color" content="#1e112a">
    <link rel="icon" type="image/png" href="Logo.png?v=5">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="particle-container" id="emberContainer"></div>
    
    <main class="container">
        <header>
            <div class="logo-container">
                <img src="Logo.png?v=5" alt="Emblema GEMATRÍA 32" class="logo">
            </div>
            <h1>GEMATRÍA 32</h1>
            <p>Análisis Numérico y Geometría del Verbo</p>
        </header>

        <section class="input-section">
            <input type="text" id="palabraInput" placeholder="Introduzca el término a analizar..." autocomplete="off" autofocus>
        </section>

        <!-- Contenedor para la proyección 3D -->
        <div id="geometriaContenedor" class="geometria-contenedor"></div>

        <section class="resultados-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Gematría Simple</h2>
                    <span class="badge">27</span>
                </div>
                <div id="resSimple" class="numero">0</div>
                <p class="descripcion-card">Cálculo Directo</p>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>Gematría Pitagórica</h2>
                    <span class="badge">1-9</span>
                </div>
                <div id="resPitagorica" class="numero">0</div>
                <p class="descripcion-card">Reducción Base</p>
            </div>
            
            <div class="card maestro-card">
                <div class="card-header">
                    <h2>Síntesis</h2>
                    <span class="badge maestro-badge">M</span>
                </div>
                <div id="resMaestro" class="numero">0</div>
                <p class="descripcion-card">Arquetipo Maestro</p>
            </div>

            <!-- Nueva Tarjeta: Número de Destino -->
            <div class="card destino-card">
                <div class="card-header">
                    <h2>Número de Destino</h2>
                    <span class="badge maestro-badge">★</span>
                </div>
                <div id="resDestino" class="numero">0</div>
                <p class="descripcion-card">Lecciones del Camino</p>
            </div>
        </section>
    </main>

    <script src="motor.js?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=5')
                    .catch(err => console.error('Fallo en el SW.', err));
            });
        }

        // Ascuas
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('emberContainer');
            if (!container) return;
            for (let i = 0; i < 30; i++) {
                const ember = document.createElement('div');
                ember.classList.add('ember');
                const size = Math.random() * 6 + 3;
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${Math.random() * 100}%`;
                ember.style.top = `${Math.random() * 100}%`;
                ember.style.animationDelay = `${Math.random() * 5}s`;
                ember.style.animationDuration = `${Math.random() * 8 + 6}s`;
                ember.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(ember);
            }
        });
    </script>
</body>
</html>
