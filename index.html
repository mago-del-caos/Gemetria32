<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gametria 32 | Análisis Numérico</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0514">
    <!-- Ruta actualizada al nuevo nombre seguro -->
    <link rel="icon" type="image/png" href="logo192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    
    <main class="container">
        <header>
            <div class="logo-container">
                <!-- Ruta actualizada al nuevo nombre seguro -->
                <img src="logo192.png" alt="Emblema Gametria 32" class="logo">
            </div>
            <h1>GAMETRIA 32</h1>
            <p>Análisis Numérico y Geometría del Verbo</p>
        </header>

        <section class="input-section">
            <input type="text" id="palabraInput" placeholder="Introduzca el término a analizar..." autocomplete="off" autofocus>
        </section>

        <section class="resultados-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Valor Simple</h2>
                    <span class="badge">27</span>
                </div>
                <div id="resSimple" class="numero">0</div>
                <p class="descripcion-card">Cálculo Directo</p>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>Valor Pitagórico</h2>
                    <span class="badge">1-9</span>
                </div>
                <div id="resPitagorica" class="numero">0</div>
                <p class="descripcion-card">Reducción Base</p>
            </div>
            
            <div class="card maestro-card">
                <div class="card-header">
                    <h2>Síntesis Numérica</h2>
                    <span class="badge maestro-badge">M</span>
                </div>
                <div id="resMaestro" class="numero">0</div>
                <p class="descripcion-card">Arquetipo Maestro</p>
            </div>
        </section>
    </main>

    <script src="motor.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.error('Fallo en el SW.', err));
            });
        }
    </script>
</body>
</html>
