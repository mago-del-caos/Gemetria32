<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMATRÍA 32 | Mesa de Trazado (v11)</title>

    <link rel="manifest" href="manifest.json?v=11">
    <meta name="theme-color" content="#1e112a">
    <link rel="icon" type="image/png" href="Logo.png?v=11">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
    <!-- Velo de Fondo y Ascuas -->
    <div class="ambient-glow"></div>
    <div class="particle-container" id="emberContainer"></div>
    
    <main class="container-fluid">
        <header>
            <div class="logo-container">
                <img src="Logo.png?v=11" alt="Emblema GEMATRÍA 32" class="logo">
            </div>
            <h1>GEMATRÍA 32</h1>
            <p>Geometría, Sigilos y Cuadros Mágicos</p>
        </header>

        <!-- Selector del Tetragrama -->
        <div class="control-panel">
            <span class="control-label">Pilares de Análisis:</span>
            <button class="btn-control active" onclick="cambiarColumnas(1)">1</button>
            <button class="btn-control" onclick="cambiarColumnas(2)">2</button>
            <button class="btn-control" onclick="cambiarColumnas(3)">3</button>
            <button class="btn-control" onclick="cambiarColumnas(4)">4</button>
        </div>

        <!-- Bóveda Dinámica -->
        <div id="paneles-container" class="paneles-grid layout-1">
            
            <!-- ================= PILAR 1 ================= -->
            <div class="panel" id="panel-1">
                <div class="input-group">
                    <!-- spellcheck="false" evita que el teclado del móvil interfiera con la entrada -->
                    <input type="text" class="palabra-input" id="input-1" placeholder="Primer término..." autocomplete="off" spellcheck="false">
                    <button class="btn-limpiar" onclick="limpiarPilar(1)" title="Purgar Pilar">✖</button>
                </div>
                
                <div class="panel-toolbar">
                    <select id="fuente-geo-1" class="geo-select" onchange="procesarInput(1)">
                        <option value="sintesis">Base: Síntesis</option>
                        <option value="destino">Base: Destino</option>
                        <option value="pitagorica">Base: Pitagórica</option>
                        <option value="simple">Base: Simple</option>
                    </select>
                    <button class="btn-visual" data-estado="geo" onclick="ciclarArte(1)">Crear Sigilo</button>
                    <button class="btn-accion" onclick="descargarArte(1)" title="Extraer Símbolo">⬇</button>
                </div>
                
                <div class="visualizador-espacial" id="visualizador-1">
                    <div id="geometria-1" class="arte-contenedor" style="display: flex;"></div>
                    <div id="sigilo-1" class="arte-contenedor" style="display: none;"></div>
                    <div id="bruno-1" class="arte-contenedor" style="display: none;"></div>
                </div>
                
                <div class="resultados-panel">
                    <div class="card"><div class="card-header"><h2>Simple</h2></div><div id="simple-1" class="numero">0</div></div>
                    <div class="card"><div class="card-header"><h2>Pitagórica</h2></div><div id="pitagorica-1" class="numero">0</div></div>
                    <div class="card maestro-card"><div class="card-header"><h2>Síntesis</h2></div><div id="maestro-1" class="numero">0</div></div>
                    <div class="card destino-card"><div class="card-header"><h2>Destino</h2></div><div id="destino-1" class="numero">0</div></div>
                </div>
            </div>

            <!-- ================= PILAR 2 ================= -->
            <div class="panel" id="panel-2" style="display: none;">
                <div class="input-group">
                    <input type="text" class="palabra-input" id="input-2" placeholder="Segundo término..." autocomplete="off" spellcheck="false">

                    <button class="btn-accion" onclick="descargarArte(2)" title="Extraer Símbolo">⬇</button>
                </div>
                <div class="visualizador-espacial" id="visualizador-2">
                    <div id="geometria-2" class="arte-contenedor" style="display: flex;"></div>
                    <div id="sigilo-2" class="arte-contenedor" style="display: none;"></div>
                    <div id="bruno-2" class="arte-contenedor" style="display: none;"></div>
                </div>
                <div class="resultados-panel">
                    <div class="card"><div class="card-header"><h2>Simple</h2></div><div id="simple-2" class="numero">0</div></div>
                    <div class="card"><div class="card-header"><h2>Pitagórica</h2></div><div id="pitagorica-2" class="numero">0</div></div>
                    <div class="card maestro-card"><div class="card-header"><h2>Síntesis</h2></div><div id="maestro-2" class="numero">0</div></div>
                    <div class="card destino-card"><div class="card-header"><h2>Destino</h2></div><div id="destino-2" class="numero">0</div></div>
                </div>
            </div>

            <!-- ================= PILAR 3 ================= -->

                    <input type="text" class="palabra-input" id="input-3" placeholder="Tercer término..." autocomplete="off" spellcheck="false">
                    <button class="btn-limpiar" onclick="limpiarPilar(3)" title="Purgar Pilar">✖</button>
                </div>
                <div class="panel-toolbar">

                </div>

                    <div id="geometria-3" class="arte-contenedor" style="display: flex;"></div>
                    <div id="sigilo-3" class="arte-contenedor" style="display: none;"></div>
                    <div id="bruno-3" class="arte-contenedor" style="display: none;"></div>
                </div>
                <div class="resultados-panel">
                    <div class="card"><div class="card-header"><h2>Simple</h2></div><div id="simple-3" class="numero">0</div></div>
                    <div class="card"><div class="card-header"><h2>Pitagórica</h2></div><div id="pitagorica-3" class="numero">0</div></div>
                    <div class="card maestro-card"><div class="card-header"><h2>Síntesis</h2></div><div id="maestro-3" class="numero">0</div></div>
                    <div class="card destino-card"><div class="card-header"><h2>Destino</h2></div><div id="destino-3" class="numero">0</div></div>
                </div>
            </div>

            <!-- ================= PILAR 4 ================= -->
            <div class="panel" id="panel-4" style="display: none;">
                <div class="input-group">
                    <input type="text" class="palabra-input" id="input-4" placeholder="Cuarto término..." autocomplete="off" spellcheck="false">
                    <button class="btn-limpiar" onclick="limpiarPilar(4)" title="Purgar Pilar">✖</button>
                </div>
                <div class="panel-toolbar">
                    <select id="fuente-geo-4" class="geo-select" onchange="procesarInput(4)">
                        <option value="sintesis">Base: Síntesis</option>
                        <option value="destino">Base: Destino</option>

                </div>
                <div class="visualizador-espacial" id="visualizador-4">
                    <div id="geometria-4" class="arte-contenedor" style="display: flex;"></div>
                    <div id="sigilo-4" class="arte-contenedor" style="display: none;"></div>
                    <div id="bruno-4" class="arte-contenedor" style="display: none;"></div>
                </div>
                <div class="resultados-panel">
                    <div class="card"><div class="card-header"><h2>Simple</h2></div><div id="simple-4" class="numero">0</div></div>
                    <div class="card"><div class="card-header"><h2>Pitagórica</h2></div><div id="pitagorica-4" class="numero">0</div></div>
                    <div class="card maestro-card"><div class="card-header"><h2>Síntesis</h2></div><div id="maestro-4" class="numero">0</div></div>
                    <div class="card destino-card"><div class="card-header"><h2>Destino</h2></div><div id="destino-4" class="numero">0</div></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Archivo Lógico Centralizado -->
    <script src="motor.js?v=11"></script>
    
    <!-- Inicializador de Entorno -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=11').catch(err => console.error('Fallo en el SW.', err));
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('emberContainer');
            if (!container) return;
            for (let i = 0; i < 30; i++) {
                const ember = document.createElement('div');
                ember.classList.add('ember');
                const size = Math.random() * 5 + 3;
                ember.style.width = `${size}px`; 
                ember.style.height = `${size}px`;
                ember.style.left = `${Math.random() * 100}%`; 
                ember.style.top = `${Math.random() * 100}%`;
                ember.style.animationDelay = `${Math.random() * 5}s`;
                ember.style.animationDuration = `${Math.random() * 7 + 5}s`;
                ember.style.opacity = Math.random() * 0.4 + 0.2;
                container.appendChild(ember);
            }
        });
    </script>
</body>
</html>
