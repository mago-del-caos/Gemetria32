<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMETRIA 32 | Análisis Numérico (v4)</title>

    <!-- PWA Manifest con Control de Versiones -->
    <link rel="manifest" href="manifest.json?v=4">
    
    <!-- Color de la barra de estado: Morado Profundo -->
    <meta name="theme-color" content="#1e112a">
    
    <!-- Ruta actualizada al nuevo emblema principal -->
    <link rel="icon" type="image/png" href="Logo.png?v=4">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="particle-container" id="emberContainer"></div> <!-- Efecto de Ascuas -->
    
    <main class="container">
        <header>
            <div class="logo-container">
                <!-- Ruta actualizada al nuevo emblema principal -->
                <img src="Logo.png?v=4" alt="Emblema GEMETRIA 32" class="logo">
            </div>
            <h1>GEMETRIA 32</h1>
            <p>Análisis Numérico y Geometría del Verbo</p>
        </header>

        <section class="input-section">
            <input type="text" id="palabraInput" placeholder="Introduzca el término a analizar..." autocomplete="off" autofocus>
        </section>

        <section class="resultados-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Valor Simple</h2>
                    <span class="badge">27</span>
                </div>
                <div id="resSimple" class="numero">0</div>
                <p class="descripcion-card">Cálculo Directo</p>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>Valor Pitagórico</h2>
                    <span class="badge">1-9</span>
                </div>
                <div id="resPitagorica" class="numero">0</div>
                <p class="descripcion-card">Reducción Base</p>
            </div>
            
            <div class="card maestro-card">
                <div class="card-header">
                    <h2>Síntesis Numérica</h2>
                    <span class="badge maestro-badge">M</span>
                </div>
                <div id="resMaestro" class="numero">0</div>
                <p class="descripcion-card">Arquetipo Maestro</p>
            </div>
        </section>
    </main>

    <!-- Enlace al motor lógico versionado -->
    <script src="motor.js?v=4"></script>

    <!-- Registro del Service Worker versionado -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Versionamos el registro del SW para forzar la actualización
                navigator.serviceWorker.register('sw.js?v=4')
                    .catch(err => console.error('Fallo en el SW.', err));
            });
        }
    </script>
    
    <!-- Generación de partículas de ascuas -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('emberContainer');
            if (!container) return;

            for (let i = 0; i < 30; i++) {
                const ember = document.createElement('div');
                ember.classList.add('ember');
                // Distribuir tamaño, posición inicial, retraso y duración de forma aleatoria
                const size = Math.random() * 6 + 3; // 3px a 9px
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${Math.random() * 100}%`;
                ember.style.top = `${Math.random() * 100}%`; // Empezar disperso por la pantalla
                ember.style.animationDelay = `${Math.random() * 5}s`;
                ember.style.animationDuration = `${Math.random() * 8 + 6}s`; // 6s a 14s
                ember.style.opacity = Math.random() * 0.5 + 0.3; // 0.3 a 0.8
                container.appendChild(ember);
            }
        });
    </script>
</body>
</html>
